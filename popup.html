<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FS PBX · Click to Dial</title><link rel="stylesheet" href="styles.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><header><div class="brand"><img src="icons/48.png" alt="" width="32" height="32"><div><strong>FS PBX</strong><span>CLICK TO DIAL</span></div></div><button class="icon-button" id="settings" aria-label="Open settings" title="Settings">⚙</button></header>
<main><div class="eyebrow">YOUR DESK PHONE</div><h1 id="identity">Connect your phone</h1><p class="muted target" id="target">Add your FS PBX settings to get started.</p>
<form id="dial-form"><label for="number">Number to call</label><input id="number" class="number" type="tel" maxlength="160" autocomplete="off" placeholder="(555) 123-4567" required aria-describedby="normalized"><div id="normalized" class="hint">The call will use your desk phone.</div>
<div class="keypad" aria-label="Dial pad"><button type="button" data-digit="1">1<small>&nbsp;</small></button><button type="button" data-digit="2">2<small>ABC</small></button><button type="button" data-digit="3">3<small>DEF</small></button><button type="button" data-digit="4">4<small>GHI</small></button><button type="button" data-digit="5">5<small>JKL</small></button><button type="button" data-digit="6">6<small>MNO</small></button><button type="button" data-digit="7">7<small>PQRS</small></button><button type="button" data-digit="8">8<small>TUV</small></button><button type="button" data-digit="9">9<small>WXYZ</small></button><button type="button" data-digit="+" aria-label="Plus">+</button><button type="button" data-digit="0">0</button><button type="button" id="backspace" aria-label="Delete last digit">⌫</button></div>
<button type="submit" class="primary full" id="call" disabled>Call on desk phone</button><button type="button" class="secondary full" id="new-call" hidden>Start another call</button></form>
<p id="status" class="status" role="status" aria-live="polite"></p>
</main><footer>Audio stays on your desk phone.</footer></body></html>
