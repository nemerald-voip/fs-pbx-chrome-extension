name: Submit Chrome Web Store update
on:
  push:
    branches: [main]
  schedule:
    # Continue after an earlier review finishes, even if there are no more pushes.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      store_action:
        description: Submit latest main, or check Google access without changing the store
        required: true
        type: choice
        default: publish
        options: [publish, check]
permissions:
  contents: read
concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false
jobs:
  submit:
    # Never give pull requests, other branches or forks access to the publisher.
    # Scheduled checks wait until setup is complete to avoid repeated setup failures.
    if: >-
      github.repository == 'nemerald-voip/fs-pbx-chrome-extension' &&
      github.ref == 'refs/heads/main' &&
      (vars.CWS_AUTOMATION_ENABLED != 'false' ||
       (github.event_name == 'workflow_dispatch' && inputs.store_action == 'check')) &&
      (github.event_name != 'schedule' ||
       (vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.CWS_SERVICE_ACCOUNT != '' &&
        vars.CWS_PUBLISHER_ID != '' && vars.CWS_EXTENSION_ID != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Coalesce quick pushes/retries into the latest main, including all changes.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build a versioned store ZIP
        id: build
        run: |
          [[ "$(git rev-parse --is-shallow-repository)" == false ]]
          python3 scripts/package.py --build-number "$(git rev-list --count HEAD)"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'schedule'
        with:
          name: store-package-${{ steps.build.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Check publishing configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          missing=0
          for key in GCP_WORKLOAD_IDENTITY_PROVIDER CWS_SERVICE_ACCOUNT CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing repository Actions variable: $key. Complete RELEASING.md."
              echo "Missing Actions variable: $key" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            echo 'Package built, but Chrome submission is NOT active: finish the one-time Google connection in RELEASING.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Authenticate to Google with a short-lived token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit latest version or check access
        id: store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PACKAGE: ${{ steps.build.outputs.package }}
          STORE_ACTION: ${{ inputs.store_action || 'publish' }}
        run: |
          case "$STORE_ACTION" in
            publish) python3 scripts/chrome_store.py "$PACKAGE" --automatic --publish ;;
            check) python3 scripts/chrome_store.py "$PACKAGE" --check ;;
            *) echo 'Invalid store action'; exit 1 ;;
          esac
